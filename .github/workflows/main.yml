name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Assemble project
      run: |
        P=app/src/main
        K=$P/java/com/darshan/todo
        mkdir -p $K $P/res/xml $P/res/drawable $P/res/mipmap-anydpi-v26
        cat > settings.gradle.kts <<'EOF'
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositories { google(); mavenCentral() } }
        rootProject.name = "TodoWidget"
        include(":app")
        EOF
        cat > build.gradle.kts <<'EOF'
        plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.20" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
        }
        EOF
        echo "android.useAndroidX=true" > gradle.properties
        cat > app/build.gradle.kts <<'EOF'
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }
        android {
            namespace = "com.darshan.todo"
            compileSdk = 34
            defaultConfig { applicationId = "com.darshan.todo"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
            buildFeatures { compose = true }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.09.00"))
            implementation("androidx.compose.material3:material3")
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.glance:glance-appwidget:1.1.0")
            implementation("androidx.datastore:datastore-preferences:1.1.1")
        }
        EOF
        cat > $P/res/xml/todo_widget_info.xml <<'EOF'
        <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
            android:minWidth="110dp" android:minHeight="110dp"
            android:targetCellWidth="2" android:targetCellHeight="2"
            android:resizeMode="horizontal|vertical" android:updatePeriodMillis="1800000"
            android:initialLayout="@layout/glance_default_loading_layout"
            android:widgetCategory="home_screen"/>
        EOF
        cat > $P/res/drawable/widget_bg.xml <<'EOF'
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#F2F6F7FF" android:endColor="#F2DDE1FF" android:angle="135"/>
            <corners android:radius="30dp"/>
            <stroke android:width="1dp" android:color="#66FFFFFF"/>
        </shape>
        EOF
        cat > $P/res/drawable/ic_ring.xml <<'EOF'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:strokeColor="#4B3BFF" android:strokeWidth="2"
                android:pathData="M12,12m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0"/>
        </vector>
        EOF
        cat > $P/res/drawable/ic_ring_red.xml <<'EOF'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:strokeColor="#E5484D" android:strokeWidth="2"
                android:pathData="M12,12m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0"/>
        </vector>
        EOF
        cat > $P/res/drawable/ic_bg.xml <<'EOF'
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#6A5BFF" android:endColor="#3A2BE0" android:angle="135"/>
        </shape>
        EOF
        cat > $P/res/drawable/ic_fg.xml <<'EOF'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF"
                android:pathData="M42,30 L66,30 A8,8 0 0 1 74,38 L74,70 A8,8 0 0 1 66,78 L42,78 A8,8 0 0 1 34,70 L34,38 A8,8 0 0 1 42,30 Z"/>
            <path android:strokeColor="#4B3BFF" android:strokeWidth="5" android:strokeLineCap="round"
                android:strokeLineJoin="round" android:pathData="M44,54 L51,61 L64,46"/>
        </vector>
        EOF
        cat > $P/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
        </adaptive-icon>
        EOF
        cp AndroidManifest.xml $P/AndroidManifest.xml
        for f in *.kt; do cp "$f" $K/; done

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Todo-App-APK
        path: app/build/outputs/apk/debug/*.apk
